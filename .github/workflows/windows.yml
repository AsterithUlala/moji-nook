name: Windows build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # attach the zip to a release when a v* tag is pushed

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        # Speech bundles are prepared for Linux only; the app runs without sound.
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DMOJI_NOOK_BUNDLE_SPEECH=OFF -DMOJI_NOOK_BUNDLE_QUALITY_SPEECH=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $out = "dist/moji-nook"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/moji-nook.exe $out
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw "$out/moji-nook.exe"
          # Ship the MSVC runtime so users do not need the VC++ redistributable.
          $crt = Get-ChildItem "$env:VCToolsRedistDir/x64/Microsoft.VC*.CRT/*.dll"
          if (-not $crt) { throw "MSVC runtime DLLs not found under $env:VCToolsRedistDir" }
          $crt | Copy-Item -Destination $out
          Remove-Item "$out/vc_redist.x64.exe" -ErrorAction Ignore
          # Only SQLite is used; the other drivers need client libraries we do not ship.
          Get-ChildItem "$out/sqldrivers" -Exclude qsqlite.dll | Remove-Item
          Copy-Item LICENSE "$out/LICENSE.txt"
          Copy-Item README.md "$out/README.md"
          Compress-Archive -Path $out -DestinationPath dist/moji-nook-windows-x64.zip

      - name: Smoke test packaged app
        shell: pwsh
        run: |
          # Run from the deployed folder with only system DLLs on PATH, so a
          # missing Qt DLL or plugin fails here instead of on a user's machine.
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $shots = "$PWD/dist/screenshots"
          $p = Start-Process dist/moji-nook/moji-nook.exe -ArgumentList "--preview", "`"$shots`"" -PassThru -NoNewWindow
          $null = $p.Handle # keep the handle so ExitCode is readable afterwards
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "moji-nook.exe --preview timed out" }
          if ($p.ExitCode -ne 0) { throw "moji-nook.exe --preview exited with $($p.ExitCode)" }
          Get-ChildItem $shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: dist/screenshots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: moji-nook-windows-x64
          path: dist/moji-nook

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/moji-nook-windows-x64.zip
